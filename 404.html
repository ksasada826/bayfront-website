<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Bayfront Partners</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://bayfront-partners.com/" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Stack+Sans+Notch:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .missing {
      min-height: 72vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 36px;
      max-width: 640px;
    }
    .missing h1 {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 4vw, 40px);
      margin: 0 0 16px;
    }
    .missing p {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.7;
    }
    .missing a.cta {
      align-self: flex-start;
    }
  </style>
</head>
<body>
  <main class="missing">
    <p class="kicker">404</p>
    <h1>Page not found</h1>
    <p>お探しのページは見つかりませんでした。<br />The page you’re looking for doesn’t exist.</p>
    <a class="cta" href="/">Bayfront Partners トップへ</a>
  </main>
</body>
</html>
